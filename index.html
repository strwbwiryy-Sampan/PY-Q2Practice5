<body>
    <h1>PYTHON DICTIONARY</h1>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                
                <form>
                    <label for="countries">Enter a country code</label>
                    <br>
                    <input type="text" id="countries" class="form-control">
                    <br>
                    <button type="button" class="btn btn-dark" py-click="check_country">Check Country</button>
                    <br>
                    <button type="button" class="btn btn-warning" py-click="show_country">Dictionary or not</button>
                </form>

            </div>
        </div>
    </div>
    
    <div id="output1"></div>
    <script type="py" src="main.py"></script>
